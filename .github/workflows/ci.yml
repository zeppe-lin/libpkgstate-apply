name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC shared, cc: gcc, cxx: g++, mode: shared}
          - {name: GCC static, cc: gcc, cxx: g++, mode: static}
          - {name: Clang shared, cc: clang, cxx: clang++, mode: shared}
          - {name: Clang static, cc: clang, cxx: clang++, mode: static}
    name: ${{ matrix.name }}
    env: {CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.0
          path: dependencies/libpkgsource
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgimage
          ref: e1f6dfd8cc4bfeb2f8da44345d8ec6368281c6e0
          path: dependencies/libpkgimage
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgbuild
          ref: v2.0.0
          path: dependencies/libpkgbuild
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgplan
          ref: libpkgplan-0.3.0
          path: dependencies/libpkgplan
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgapply
          ref: v2.3.0
          path: dependencies/libpkgapply
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate
          ref: v3.0.0
          path: dependencies/libpkgstate
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-source
          ref: v3.0.0
          path: dependencies/libpkgstate-source
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-build
          ref: v3.0.0
          path: dependencies/libpkgstate-build
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang doxygen libacl1-dev libarchive-dev libssl-dev mandoc ninja-build pkg-config python3-venv scdoc
      - run: python3 -m venv "$RUNNER_TEMP/meson" && "$RUNNER_TEMP/meson/bin/pip" install meson==1.6.1 && echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Build dependency closure
        run: |
          prefix="$RUNNER_TEMP/prefix"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$prefix/lib"
          for dep in libpkgsource libpkgimage libpkgbuild libpkgplan libpkgapply libpkgstate libpkgstate-source libpkgstate-build; do
            meson setup "dependency-build/$dep" "dependencies/$dep" --wrap-mode=nofallback --prefix="$prefix" --libdir=lib -Ddefault_library="${{ matrix.mode }}" -Dlink_mode="${{ matrix.mode }}" -Dtests=disabled -Dman_pages=disabled
            meson compile -C "dependency-build/$dep"
            meson install -C "dependency-build/$dep"
          done
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - run: ./ci/configure-and-test.sh build "${{ matrix.mode }}" -Dman_pages=enabled
      - run: doxygen Doxyfile
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: for s in ci/*.sh tests/*.sh; do sh -n "$s"; done
      - run: ./tests/check_extraction.sh "$PWD" && ./tests/check_architecture.sh "$PWD" && ./tests/check_repository.sh "$PWD" && ./tests/check_release_metadata.sh "$PWD"
