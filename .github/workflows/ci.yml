name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC shared, cc: gcc, cxx: g++, mode: shared, buildtype: debug, ndebug: false, man: enabled}
          - {name: GCC static, cc: gcc, cxx: g++, mode: static, buildtype: debug, ndebug: false, man: disabled}
          - {name: Clang shared, cc: clang, cxx: clang++, mode: shared, buildtype: debug, ndebug: false, man: disabled}
          - {name: Clang static, cc: clang, cxx: clang++, mode: static, buildtype: debug, ndebug: false, man: disabled}
          - {name: GCC release, cc: gcc, cxx: g++, mode: shared, buildtype: release, ndebug: true, man: disabled}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out libpkgstate-apply
        uses: actions/checkout@v4
      - name: Check out libpkgsource 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.0
          path: dependencies/libpkgsource
      - name: Check out libpkgimage 0.4.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgimage
          ref: v0.4.0
          path: dependencies/libpkgimage
      - name: Check out libpkgbuild 2.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgbuild
          ref: v2.0.0
          path: dependencies/libpkgbuild
      - name: Check out libpkgplan 0.3.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgplan
          ref: v0.3.0
          path: dependencies/libpkgplan
      - name: Check out libpkgsource-plan 1.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource-plan
          ref: v1.0.0
          path: dependencies/libpkgsource-plan
      - name: Check out libpkgapply 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgapply
          ref: v3.0.0
          path: dependencies/libpkgapply
      - name: Check out libpkgstate 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate
          ref: v3.0.0
          path: dependencies/libpkgstate
      - name: Check out libpkgstate-source 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-source
          ref: v3.0.0
          path: dependencies/libpkgstate-source
      - name: Check out libpkgstate-build 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-build
          ref: v3.0.0
          path: dependencies/libpkgstate-build
      - name: Check out libpkgstate-plan 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-plan
          ref: v3.0.0
          path: dependencies/libpkgstate-plan
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            clang \
            doxygen \
            libacl1-dev \
            libarchive-dev \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            mandoc \
            ninja-build \
            pkg-config \
            python3-venv \
            scdoc \
            zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.6.1'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Build dependency closure
        run: |
          prefix="$RUNNER_TEMP/prefix"
          MESON_BUILDTYPE="${{ matrix.buildtype }}" \
            ./ci/build-dependencies.sh dependencies dependency-build "$prefix" "${{ matrix.mode }}"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Configure, build, and test
        run: |
          ./ci/configure-and-test.sh build "${{ matrix.mode }}" \
            --buildtype="${{ matrix.buildtype }}" \
            -Db_ndebug="${{ matrix.ndebug }}" \
            -Dman_pages="${{ matrix.man }}"
      - name: Qualify public API documentation
        if: matrix.name == 'GCC shared'
        run: doxygen Doxyfile
      - name: Qualify manual
        if: matrix.man == 'enabled'
        run: ./ci/lint-manpage.sh build
      - name: Qualify installed consumer and dependency boundary
        run: ./ci/qualify-installed.sh build "${{ matrix.mode }}"

  sanitizers:
    name: ${{ matrix.name }} sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC, cc: gcc, cxx: g++}
          - {name: Clang, cc: clang, cxx: clang++}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - name: Check out libpkgstate-apply
        uses: actions/checkout@v4
      - name: Check out libpkgsource 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.0
          path: dependencies/libpkgsource
      - name: Check out libpkgimage 0.4.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgimage
          ref: v0.4.0
          path: dependencies/libpkgimage
      - name: Check out libpkgbuild 2.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgbuild
          ref: v2.0.0
          path: dependencies/libpkgbuild
      - name: Check out libpkgplan 0.3.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgplan
          ref: v0.3.0
          path: dependencies/libpkgplan
      - name: Check out libpkgsource-plan 1.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource-plan
          ref: v1.0.0
          path: dependencies/libpkgsource-plan
      - name: Check out libpkgapply 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgapply
          ref: v3.0.0
          path: dependencies/libpkgapply
      - name: Check out libpkgstate 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate
          ref: v3.0.0
          path: dependencies/libpkgstate
      - name: Check out libpkgstate-source 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-source
          ref: v3.0.0
          path: dependencies/libpkgstate-source
      - name: Check out libpkgstate-build 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-build
          ref: v3.0.0
          path: dependencies/libpkgstate-build
      - name: Check out libpkgstate-plan 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgstate-plan
          ref: v3.0.0
          path: dependencies/libpkgstate-plan
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang libacl1-dev libarchive-dev libbz2-dev liblz4-dev \
            liblzma-dev libssl-dev libxml2-dev libzstd-dev ninja-build \
            pkg-config python3-venv zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.6.1'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Build sanitized dependency closure
        run: |
          prefix="$RUNNER_TEMP/prefix"
          MESON_BUILDTYPE=debug MESON_SANITIZE=address,undefined \
            ./ci/build-dependencies.sh dependencies dependency-build "$prefix" shared
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Configure, build, and test
        run: |
          ./ci/configure-and-test.sh build-sanitize shared \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dman_pages=disabled
